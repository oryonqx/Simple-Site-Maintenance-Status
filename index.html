<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101820">
    <meta name="description" content="A better shopping experience is on the way.">
    <title>Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="notice" aria-labelledby="page-title">
            <h1 id="page-title">A better shopping experience is on the way.</h1>
            <p class="message">
                We’re working on something new. Please check back soon for updates.
            </p>

            <div class="actions">
                <a class="website" href="https://example.com" target="_blank">
                    Visit our website
                    <span class="arrow" aria-hidden="true">↗</span>
                </a>
                <a class="mail" href="mailto:youreemail@youreemail.com" target="_blank">
                    Contact us
                </a>
                <a class="social" href="https://example.com" target="_blank">
                    Check our social
                    <span class="arrow" aria-hidden="true">↗</span>
                </a>
            </div>
            <p class="note">Thanks for your patience. Well back soon..</p>
        </section>
    </main>
</body>
</html>
