<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101820">
    <meta name="description" content="A better shopping experience is on the way.">
    <title>Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="notice" aria-labelledby="page-title">
            <h1 id="page-title">A better shopping experience is on the way.</h1>
            <p class="message">
                We’re working on something new. Please check back soon for updates.
            </p>

            <div class="actions">
                <a class="button button--primary" href="https://xumurnetwork.com">
                    Visit our website
                    <span class="button__arrow" aria-hidden="true">↗</span>
                </a>
                <a class="button button--secondary" href="mailto:info@xumurnetwork.com">
                    Contact us
                </a>
            </div>

            <p class="note">Thanks for your patience.</p>
        </section>
    </main>
</body>
</html>
